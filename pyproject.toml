[project]
name = "gridkit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cartopy>=0.25.0",
    "cdsapi>=0.7.7",
    "contextily>=1.7.0",
    "folium>=0.20.0",
    "geopandas>=1.1.3",
    "matplotlib>=3.10.9",
    "networkx>=3.6.1",
    "numpy>=2.4.4",
    "osmnx>=2.1.0",
    "pandas>=3.0.2",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "pycity-base>=0.3.1",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.1",
    "pyproj>=3.7.2",
    "pypsa>=1.2.0",
    "ray[rllib]>=2.55.1",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
    "streamlit>=1.61.1",
    "streamlit-folium>=0.27.4",
    "torch>=2.12.1",
    "tqdm>=4.67.3",
    "xarray>=2026.2.0",
]
[tool.pytest.ini_options]
pythonpath = ["src/GridKIT", "src"]

[project.scripts]
gridkit-app          = "GridKIT.scripts.app:main"
gridkit-train        = "GridKIT.scripts.train:main"
gridkit-experiment   = "GridKIT.scripts.run_experiment:main"
gridkit-plot-results = "GridKIT.scripts.plot_results:main"
